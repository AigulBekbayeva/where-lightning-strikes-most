name: Build data

# Запускается вручную: Actions → Build data → Run workflow.
# Нужен секрет репозитория CDSAPI_KEY (персональный токен Copernicus CDS).
# Необязательно: EARTHDATA_USERNAME / EARTHDATA_PASSWORD — запасной путь к LIS/OTD.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Период ERA5"
        default: "1995-2014"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install
        run: pip install -r scripts/requirements.txt

      - name: Download and process
        env:
          CDSAPI_URL: https://cds.climate.copernicus.eu/api
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: python scripts/prepare_data.py --years "${{ inputs.years }}"

      - name: Commit layers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/grid
          git diff --cached --quiet && echo "Нет изменений" && exit 0
          git commit -m "Update data layers (LIS/OTD HRFC + ERA5 ${{ inputs.years }})"
          git push
